  const ROUTES = new Set(Object.keys(PAGES));
  const frame = document.getElementById("page-frame");
  const loading = document.getElementById("route-loading");

  function decodeBase64Utf8(value) {
    const bytes = Uint8Array.from(atob(value), c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  }

  function normalizeRoute(raw) {
    let route = (raw || "").replace(/^#/, "").trim().toLowerCase();
    const aliases = {
      "": "home",
      "home": "home",
      "events": "events-archive",
      "archive": "events-archive",
      "events-archive": "events-archive",
      "join": "join-us",
      "join-us": "join-us",
      "register": "join-us",
      "member": "member-dashboard",
      "member-dashboard": "member-dashboard",
      "member-profile": "member-dashboard",
      "about": "home",
      "about-chapter": "home",
      "team": "home",
      "leadership-team": "home",
      "gallery": "gallery",
      "contact": "join-us",
      "recursive-assault": "recursive-assault",
      "cloud-bootcamp": "cloud-bootcamp",
      "keynote": "keynote",
      "algoquest": "algoquest"
    };
    return aliases[route] || (ROUTES.has(route) ? route : "home");
  }

  function routeFromUrl() {
    return normalizeRoute(location.hash);
  }

  function showRoute(route, updateUrl) {
    route = normalizeRoute(route);
    loading.classList.remove("hidden");
    if (updateUrl) {
      const target = "#" + route;
      if (location.hash !== target) history.pushState({route}, "", target);
    }
    frame.onload = function() {
      loading.classList.add("hidden");
      try { frame.contentWindow.scrollTo(0, 0); } catch (_) {}
    };
    frame.srcdoc = decodeBase64Utf8(PAGES[route]);
    document.title = {
      home: "ACM Student Chapter — MITS Gwalior",
      "events-archive": "Events & Innovation Archive",
      "join-us": "Become an ACM MITS Innovator",
      "member-dashboard": "Aarav Sharma — Member Dashboard",
      "recursive-assault": "Recursive Assault 2026",
      "cloud-bootcamp": "Cloud Infrastructure & Microservices",
      gallery: "ACM MITS — Gallery",
      keynote: "AI & Machine Learning",
      algoquest: "AlgoQuest 2026"
    }[route] || "ACM MITS Chapter";
  }

  window.addEventListener("message", function(event) {
    if (!event.data || event.data.type !== "single-file-route") return;
    showRoute(event.data.route, true);
  });

  window.addEventListener("popstate", function() {
    showRoute(routeFromUrl(), false);
  });

  window.addEventListener("hashchange", function() {
    showRoute(routeFromUrl(), false);
  });

  showRoute(routeFromUrl(), false);
})();
